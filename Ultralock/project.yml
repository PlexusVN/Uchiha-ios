name: Ultralock
options:
  bundleIdPrefix: com.ultralock
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_ON_DEMAND_RESOURCES: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
  configs:
    Release:
      COPY_PHASE_STRIP: YES
      STRIP_STYLE: all
      STRIP_INSTALLED_PRODUCT: YES
      SEPARATE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_COMPILER_CODE_COVERAGE_GENERATE_DEBUG_INFO: NO
targets:
  Ultralock:
    type: application
    platform: iOS
    sources:
      - path: Sources/UchihaUltralock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultralock.ios
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/UchihaUltralock/Info.plist
      properties:
        CFBundleName: "Uchiha Ultralock"
        CFBundleDisplayName: "Uchiha Ultralock"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - itachi_ios_avt_1024

name: Ultralock
options:
  bundleIdPrefix: com.ultralock
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Ultralock:
    type: application
    platform: iOS
    sources:
      - path: Sources/UchihaUltralock
      - path: Sources/UchihaUltralock/Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultralock.ios
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/UchihaUltralock/Info.plist
      properties:
        CFBundleName: "Uchiha Ultralock"
        CFBundleDisplayName: "Uchiha Ultralock"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
